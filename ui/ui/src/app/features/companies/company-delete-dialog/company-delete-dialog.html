<h2 mat-dialog-title class="company-delete-dialog__title">
  <svg lucideTriangleAlert [size]="20" aria-hidden="true"></svg>
  Delete company?
</h2>
<mat-dialog-content>
  <p>
    Are you sure you want to delete <strong>"{{ data.companyName }}"</strong>? This action cannot be
    undone.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="warn" type="button" (click)="confirm()">Delete</button>
</mat-dialog-actions>
