<div class="hero-illustration" aria-hidden="true">
  <div class="hero-illustration__glow"></div>

  <div class="hero-illustration__card hero-illustration__card--cv">
    <div class="hero-illustration__card-header">
      <span class="hero-illustration__avatar"></span>
      <div class="hero-illustration__header-lines">
        <span class="hero-illustration__line hero-illustration__line--title"></span>
        <span class="hero-illustration__line hero-illustration__line--subtitle"></span>
      </div>
    </div>
    <div class="hero-illustration__section-label">
      <svg lucideFileText [size]="12"></svg>
      <span>Experience</span>
    </div>
    <span class="hero-illustration__line"></span>
    <span class="hero-illustration__line"></span>
    <span class="hero-illustration__line hero-illustration__line--short"></span>
  </div>

  <div class="hero-illustration__card hero-illustration__card--letter">
    <div class="hero-illustration__letter-badge">
      <svg lucideSparkles [size]="13"></svg>
      <span>AI generated</span>
    </div>
    <span class="hero-illustration__line"></span>
    <span class="hero-illustration__line"></span>
    <span class="hero-illustration__line"></span>
    <span class="hero-illustration__line hero-illustration__line--short"></span>
  </div>

  <div class="hero-illustration__pill hero-illustration__pill--primary">
    <span class="hero-illustration__pill-icon">
      <svg lucideCheck [size]="14"></svg>
    </span>
    <span>Application sent</span>
  </div>

  <div class="hero-illustration__pill hero-illustration__pill--secondary">
    <span class="hero-illustration__pill-icon hero-illustration__pill-icon--accent">
      <svg lucideBriefcase [size]="14"></svg>
    </span>
    <span>3 jobs saved</span>
  </div>
</div>
