<button
  mat-icon-button
  type="button"
  [matMenuTriggerFor]="menu"
  matTooltip="Account"
  aria-label="Account menu"
>
  <span class="user-menu__avatar" aria-hidden="true">{{ initial() }}</span>
</button>

<mat-menu #menu="matMenu" xPosition="before">
  <button mat-menu-item type="button" routerLink="/profile">
    <svg lucideUser [size]="18" class="user-menu__item-icon" aria-hidden="true"></svg>
    <span>Profile</span>
  </button>
  <button mat-menu-item type="button" (click)="logout()">
    <svg lucideLogOut [size]="18" class="user-menu__item-icon" aria-hidden="true"></svg>
    <span>Log out</span>
  </button>
</mat-menu>
