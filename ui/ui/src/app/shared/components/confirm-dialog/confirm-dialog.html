<h2 mat-dialog-title class="confirm-dialog__title">
  <svg lucideTriangleAlert [size]="20" aria-hidden="true"></svg>
  {{ data.title }}
</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">{{ data.cancelLabel ?? 'Cancel' }}</button>
  <button mat-flat-button color="warn" type="button" (click)="confirm()">
    {{ data.confirmLabel ?? 'Delete' }}
  </button>
</mat-dialog-actions>
