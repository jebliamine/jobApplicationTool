spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/japp
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: "1"

  app:
    bootstrap-admin:
      email: admin@japp.com
      password: ChangeMe123!

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${AI_GEMINI_MODEL:gemini-3.7-flash}
    base-url: ${AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout: ${AI_GEMINI_TIMEOUT:30s}
  credentials:
    encryption-key: ${AI_CREDENTIALS_ENCRYPTION_KEY:}

logging:
  level:
    org.springframework.security: TRACE