spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/japp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: "1"

  app:
    bootstrap-admin:
      # Defaults keep local `mvn spring-boot:run` working with zero setup;
      # override both via env vars for anything beyond a solo local dev box —
      # AdminSeeder logs a warning on startup if the password is still the
      # default, so a forgotten override is at least visible in the logs.
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@japp.de}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    # Defaults point at nothing real (no local SMTP catcher is bundled with this
    # project) — password-reset/verification emails simply fail to send until
    # these are overridden, same "still starts, only the dependent feature fails"
    # convention as AI_CREDENTIALS_ENCRYPTION_KEY. Point SMTP_HOST/PORT at a local
    # dev mail catcher (e.g. MailHog/Mailpit on 1025) or a real SMTP provider.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

app:
  cors:
    # Comma-separated list of allowed origins. Defaults to the local Angular
    # dev server; override for any deployed environment.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}

ai:
  credentials:
    encryption-key: ${AI_CREDENTIALS_ENCRYPTION_KEY:}

job-search:
  # Each external source is independently optional — same "still starts, only the dependent
  # feature is disabled" convention as AI_CREDENTIALS_ENCRYPTION_KEY/SMTP above. The job-search
  # page simply omits a source (and says so) until its key(s) are set.
  adzuna:
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
    country: ${ADZUNA_COUNTRY:de}
    results-per-page: ${ADZUNA_RESULTS_PER_PAGE:20}
  jooble:
    api-key: ${JOOBLE_API_KEY:}
  jsearch:
    rapidapi-key: ${JSEARCH_RAPIDAPI_KEY:}

logging:
  level:
    org.springframework.security: TRACE